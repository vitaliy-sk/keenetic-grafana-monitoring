[influx2]
url=http://<influx_ip>:8086
# For influx v1.x please use "-" as a value
org=keenetic
# For influx v1.x please use "username:password" as a token
token=<token>
timeout=6000
# For influx v1.x DB name
bucket=keenetic
# InfluxDB 2.x only: the Grafana dashboard uses InfluxQL, which requires a
# DBRP mapping between the bucket and a 1.x-style database name:
#   influx v1 dbrp create --db keenetic --rp autogen --bucket-id <bucket_id> --default
# When using docker-compose.yml from this repository this is handled by the
# influxdb-init-dbrp service.
[keenetic]
admin_endpoint=http://<keenetic_ip>:80
skip_auth=false
login=<user>
password=<pass>
[collector]
interval_sec=30
